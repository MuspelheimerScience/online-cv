career_profile:
    title: Professional Profile
    summary: |
      Ph.D. Scientist with over 15 years of international experience (USA, Japan, Germany, Mexico) in high-level research and laboratory management. Specialized in Molecular Microbiology, Biophysics, and Synthetic Biology. Expert in "Hackenomics": optimizing scientific infrastructure through 3D printing, microfluidics, and open-source automation. Founder of Glyxon Biolabs, dedicated to CO2 sequestration and biopolymers biosynthesis.

education:
    - degree: Ph.D. in Biomedical Sciences
      university: Universidad Nacional Autónoma de México (UNAM)
      time: 2003 - 2009
      details: Molecular Microbiology and Biophysics at the Instituto de Fisiología Celular.
    - degree: Bachelor of Sciences, Microbiology
      university: UNAM, Faculty of Sciences
      time: 1998 - 2003

experiences:
    - role: Research Scientist
      time: May 2023 – Jul 2024
      company: Arizona State University (Biodesign Institute)
      details: |
        Center of Mechanisms of Evolution. Supervised and trained undergrads, grads, and postdocs. Developed E. coli mutants for flagellar stator motor studies. Optimized GEVIs for membrane potential measurements via confocal microscopy. Created protein tag fusions for membrane protein reconstitution in artificial liposomes.
    - role: Founder & Advisor
      time: 2019 – Present
      company: GLYXON Biolabs (DIY Biospace)
      details: |
        Studies micro-algae, plants, and bacterial models for CO2 sequestration and biopolymers biosynthesis. Current developments: 'Lab on a chip' flexible bioreactors, EWoD micropumps, and optogenetics (pDusk/pDawn). Partnered with Ottawa BioScience, JOGL-CRI, and Cambridge Open Bioeconomy Lab.
    - role: Panel Reviewer
      time: Mar 2023 – Jun 2023
      company: Internet of Production Alliance
      details: Evaluated projects mapping digital manufacturing capabilities across Africa and LATAM for the "Open Know Where Awards".
    - role: Academic Project Administrator
      time: Mar 2022 - May 2022
      company: Pontífica Universidad Católica de Chile
      details: Coordinated the LIBRE_hub project (Latin American Hub for Bioimaging through Open Hardware) funded by the Chan-Zuckerberg Initiative.
    - role: Postdoctoral Researcher
      time: May 2017 – Dec 2017
      company: UNAM (Institute of Ecology / Institute of Physics / C3)
      details: |
        Developed a Robotic system for single-cell genetic expression profiling. Built an automated system for histological inclusion of vegetal tissues using 3D printing, microcontroller-operated syringe pumps (Arduino/RPi), and PID temperature control.
    - role: Business Unit Manager
      time: Oct 2014 - April 2015
      company: Customized Premium Products S.A. de C.V.
      details: |
        Directed a multidisciplinary team (MDs, PhDs, Economists) providing strategic market intelligence for Big Pharma (Eli Lilly, Bayer, Roche, Novartis, Amgen). Managed technical dossiers for COFEPRIS and implemented automated CRM platforms.
    - role: Junior Researcher
      time: Nov 2012 – Mar 2014
      company: Waseda University (Tokyo, Japan)
      details: |
        Systems biology of microbial ATP synthase in artificial liposomes using microfluidic chips. Microfabrication of surfaces via FIB microscopy and PDMS masking. Real-time nanophotometric measurements of FoF1-ATPase rotation.
    - role: Postdoctoral Researcher
      time: Jul 2010 – Sep 2012
      company: Osaka University (Namba Lab, Japan)
      details: |
        Research on nano high-speed photometry of bacterial flagellum motor. Performed protein engineering, Western blots, and TIRF microscopy. Trained students in structural analysis of transmembrane proton channels.
    - role: Postdoctoral Researcher
      time: May 2009 – Jun 2010
      company: Max Planck Institute for Terrestrial Microbiology (Germany)
      details: |
        Studied Type 4 pili assembly in Myxococcus xanthus. Used analytical ultracentrifugation for membrane sub-cellular fractionation and FRET microscopy for spatial localization.


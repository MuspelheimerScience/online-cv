experiences:
    - role: Research Scientist
      time: May 2023 – Jul 2024
      company: Arizona State University (Biodesign Institute)
      details: |
        Center of Mechanisms of Evolution. Multi-role Research Scientist:
        * Trained and supervised undergrad/graduate students and postdocs in molecular microbiology.
        * Developed E. coli mutants for flagellar stator motor re-moderation studies.
        * Implemented and optimized Genetically Encoded Voltages Indicators (GEVIs) for membrane potential measurements using confocal microscopy.
        * Created protein tag fusions for cloning, overexpression, and purification of membrane protein channels for reconstitution in artificial liposomes.

    - role: Business Unit Manager
      time: Oct 2014 - April 2015
      company: Customized Premium Products S.A. de C.V.
      details: |
        Directed a team of specialists (Economists, Biochemists, MDs, Epidemiologists) and sales force.
        * Strategic market intelligence for the pharmaceutical industry based on clinical evidence and epidemiological modeling.
        * Delivered market profiles for cancer, diabetes, HIV, and medical devices (POC) for Mexico and LATAM.
        * Technical and economic dossiers for COFEPRIS registration.
        * **Clients Managed:** Eli Lilly, Bristol Myers Squibb, Bayer, Roche, Novartis, Teva, Amgen, Eisai Ltd.
        * **Achievements:** Reshaped Business Unit roles; implemented automated project management platforms (CRM/Sales tracking); trained staff in process engineering and real-time prorating.

    - role: Postdoctoral Researcher
      time: May 2017 – Dec 2017
      company: UNAM (Institute of Ecology / Physics / C3)
      details: |
        Developed a Robotic system for single-cell genetic expression profiling via Laser Microdissection Microscopy. 
        * Constructed an automated system for histological inclusion of vegetal tissues.
        * Prototype: Microcontroller-operated (Arduino/RPi) motorized system with syringe pumps, peristaltic pumps, PID temperature control, and flow meter.
        * Built using additive construction (3D printing).

    - role: Junior Researcher
      time: Nov 2012 – Mar 2014
      company: Waseda University (Tokyo, Japan)
      details: |
        Project: Systems biology and biophysics of microbial ATP synthase in artificial liposomes using microfluidic chips.
        * Microfabrication of surfaces via FIB microscopy and PDMS masking.
        * Real-time, high-speed nanophotometric measurements of FoF1-ATPase rotation.
        * Chemical conjugation for attaching large ATPase complexes into functionalized metal-glass surfaces.

    - role: Postdoctoral Researcher
      time: Jul 2010 – Sep 2012
      company: Osaka University (Namba Lab, Japan)
      details: |
        Project: Nano high-speed photometry of bacterial flagellum motor.
        * Theoretical and practical study on engine dynamics.
        * Protein engineering, Western blot localization, and TIRF microscopy.
        * Biophysical model integration of flagellar motor rotation using high-speed cameras.

    - role: Postdoctoral Researcher
      time: May 2009 – Jun 2010
      company: Max Planck Institute for Terrestrial Microbiology (Germany)
      details: |
        Project: Biosynthesis of Type 4 pili assembly of Myxococcus xanthus.
        * Cellular fractionation using analytical ultracentrifugation.
        * FRET microscopy for intracellular spatial localization.
        * Overexpression and purification of proteins for antibody production via manual/automated IMAC.

    - role: Founder & Advisor
      time: 2019 – Present
      company: GLYXON Biolabs
      details: |
        DIY Biospace for biomaterials (www.glyxon.com).
        * Studies micro-algae and bacterial models for CO2 sequestration and biopolymers.
        * **Developments:** Flexible low-cost bioreactors, EWoD micropumps, Optogenetics (pDusk/pDawn), Proteopresso (automated protein purification), and Tissue Macro Photogrammetry.
        * **Partners:** Ottawa BioScience, JOGL-CRI, Cambridge Open Bioeconomy Lab, Gaudi Labs, Osaka University.

